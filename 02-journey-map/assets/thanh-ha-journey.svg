<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="194" viewBox="0 0 1120 194" role="img" aria-labelledby="title desc">
<title id="title">Năm giai đoạn trong hành trình của Thanh Hà</title><desc id="desc">Nhu cầu &amp; tìm thông tin → Đặt lịch → Chuẩn bị trước khám → Đến viện &amp; check-in → Tìm phòng, chờ &amp; vào khám</desc>
